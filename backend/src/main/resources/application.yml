server:
  # Coolify e outros provedores injetam a porta via env PORT.
  port: ${PORT:8080}

spring:
  application:
    name: site-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

trcon:
  site:
    cors:
      allowed-origins: ${TRCON_CORS_ALLOWED_ORIGINS}
    internal-api-key: ${TRCON_SITE_INTERNAL_API_KEY}
    public-base-url: ${TRCON_SITE_PUBLIC_BASE_URL:https://trcongroup.com.br}
    content:
      # Default de fábrica = 3; 0 = permanente. Override: SITE_CONTENT_TTL_DAYS=2|6|…
      ttl-days: ${SITE_CONTENT_TTL_DAYS:3}
      expiry-cron: ${SITE_CONTENT_EXPIRY_CRON:0 15 3 * * *}
    mail:
      enabled: ${TRCON_SITE_MAIL_ENABLED:false}
      api-key: ${TRCON_SITE_MAIL_API_KEY:}
      from: ${TRCON_SITE_MAIL_FROM:}
      notify-to: ${TRCON_SITE_LEAD_NOTIFY_TO:contato@trcongroup.com.br}
    chat:
      ai:
        enabled: ${TRCON_SITE_CHAT_ENABLED:false}
        stub-enabled: ${TRCON_SITE_CHAT_STUB_ENABLED:false}
        api-key: ${TRCON_SITE_DEEPSEEK_API_KEY:}
        base-url: ${TRCON_SITE_DEEPSEEK_BASE_URL:https://api.deepseek.com}
        model: ${TRCON_SITE_DEEPSEEK_MODEL:deepseek-chat}
        max-output-tokens: ${TRCON_SITE_CHAT_MAX_OUTPUT_TOKENS:400}
        max-history-turns: ${TRCON_SITE_CHAT_MAX_HISTORY_TURNS:6}
        rate-limit-per-minute: ${TRCON_SITE_CHAT_RATE_LIMIT_PER_MINUTE:8}
        monthly-budget-usd: ${TRCON_SITE_CHAT_MONTHLY_BUDGET_USD:10}
        input-cost-per-1m-usd: ${TRCON_SITE_CHAT_INPUT_COST_PER_1M_USD:0.14}
        output-cost-per-1m-usd: ${TRCON_SITE_CHAT_OUTPUT_COST_PER_1M_USD:0.28}
