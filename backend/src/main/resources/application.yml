server:
  # Coolify e outros provedores injetam a porta via env PORT.
  port: ${PORT:8080}

spring:
  application:
    name: site-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

trcon:
  site:
    cors:
      allowed-origins: ${TRCON_CORS_ALLOWED_ORIGINS}
    internal-api-key: ${TRCON_SITE_INTERNAL_API_KEY}
    public-base-url: ${TRCON_SITE_PUBLIC_BASE_URL:https://trcongroup.com.br}
    content:
      # Default de fábrica = 3; 0 = permanente. Override: SITE_CONTENT_TTL_DAYS=2|6|…
      ttl-days: ${SITE_CONTENT_TTL_DAYS:3}
      expiry-cron: ${SITE_CONTENT_EXPIRY_CRON:0 15 3 * * *}
    mail:
      enabled: ${TRCON_SITE_MAIL_ENABLED:false}
      api-key: ${TRCON_SITE_MAIL_API_KEY:}
      from: ${TRCON_SITE_MAIL_FROM:}
      notify-to: ${TRCON_SITE_LEAD_NOTIFY_TO:contato@trcongroup.com.br}
