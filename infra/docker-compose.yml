name: trcon-site

services:
  postgres:
    image: postgres:16-alpine
    container_name: trcon-site-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-trcon_site}
      POSTGRES_USER: ${DB_USERNAME:-trcon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trcon}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - trcon_site_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-trcon} -d ${DB_NAME:-trcon_site}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: trcon-site-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-trcon_site}
      DB_USERNAME: ${DB_USERNAME:-trcon}
      DB_PASSWORD: ${DB_PASSWORD:-trcon}
      TRCON_CORS_ALLOWED_ORIGINS: ${TRCON_CORS_ALLOWED_ORIGINS:-http://localhost:4173,http://127.0.0.1:4173}
      TRCON_SITE_CHAT_ENABLED: ${TRCON_SITE_CHAT_ENABLED:-true}
      TRCON_SITE_CHAT_STUB_ENABLED: ${TRCON_SITE_CHAT_STUB_ENABLED:-true}
      TRCON_SITE_DEEPSEEK_API_KEY: ${TRCON_SITE_DEEPSEEK_API_KEY:-}
      TRCON_SITE_DEEPSEEK_BASE_URL: ${TRCON_SITE_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      TRCON_SITE_DEEPSEEK_MODEL: ${TRCON_SITE_DEEPSEEK_MODEL:-deepseek-flash}
      TRCON_SITE_CHAT_MAX_OUTPUT_TOKENS: ${TRCON_SITE_CHAT_MAX_OUTPUT_TOKENS:-400}
      TRCON_SITE_CHAT_MAX_HISTORY_TURNS: ${TRCON_SITE_CHAT_MAX_HISTORY_TURNS:-6}
      TRCON_SITE_CHAT_RATE_LIMIT_PER_MINUTE: ${TRCON_SITE_CHAT_RATE_LIMIT_PER_MINUTE:-8}
      TRCON_SITE_CHAT_MONTHLY_BUDGET_USD: ${TRCON_SITE_CHAT_MONTHLY_BUDGET_USD:-10}
      TRCON_SITE_CHAT_INPUT_COST_PER_1M_USD: ${TRCON_SITE_CHAT_INPUT_COST_PER_1M_USD:-0.30}
      TRCON_SITE_CHAT_OUTPUT_COST_PER_1M_USD: ${TRCON_SITE_CHAT_OUTPUT_COST_PER_1M_USD:-1.20}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  trcon_site_pgdata:
    name: trcon_site_pgdata
